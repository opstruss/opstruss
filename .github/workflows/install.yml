name: install

# The install script from this tree installs a published release, which
# only a change to the script or to this workflow can break.
on:
  push:
    branches:
      - main
      - 'release/v*'
    paths:
      - docs/public/install.sh
      - .github/workflows/install.yml
  pull_request:
    paths:
      - docs/public/install.sh
      - .github/workflows/install.yml

permissions:
  contents: read

jobs:
  install:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh docs/public/install.sh
        env:
          OPSTRUSS_VERSION: 1.0.0
          OPSTRUSS_INSTALL_DIR: ${{ runner.temp }}/bin
      - run: '"$RUNNER_TEMP/bin/opstruss" version | grep -F "opstruss v1.0.0 "'
