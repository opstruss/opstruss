name: release

on:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: false
      # The notes are the CHANGELOG.md section of this version, written
      # "## [1.2.3] - 2026-11-02" once [Unreleased] became the release. A
      # release candidate, a tag with a pre-release part as v1.0.0-rc.1,
      # gets the section [Unreleased] after an opening that says what it is
      # and how to install it.
      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          rc=0
          case "$version" in *-*) rc=1 ;; esac
          awk -v version="$version" -v rc="$rc" '
            rc && $1 == "##" && $2 == "[Unreleased]" { found = 1; next }
            !rc && $1 == "##" && $2 == "[" version "]" {
              if ($3 != "-" || $4 !~ /^[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]$/) exit 1
              found = 1; next
            }
            found && (/^## / || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/section.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/section.md"
          if [ "$rc" = 1 ]; then
            final="${version%%-*}"
            cat > "$RUNNER_TEMP/notes.md" <<EOF
          OpsTruss $version is a release candidate of $final, published to be
          tried before the release. The compatibility promise starts with
          $final: until then, commands, files, and the data that a release
          candidate writes may still change.

              mise use github:opstruss/opstruss@$version
              go install github.com/opstruss/opstruss@v$version

          Report what you find at https://github.com/opstruss/opstruss/issues.
          EOF
          fi
          cat "$RUNNER_TEMP/section.md" >> "$RUNNER_TEMP/notes.md"
      - run: goreleaser release --clean --release-notes "$RUNNER_TEMP/notes.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
