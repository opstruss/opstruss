name: ci

on:
  push:
    branches:
      - main
      - 'release/v*'
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request or branch makes the older run
# redundant: it tests a tree the newer one contains.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The module and build caches of go, one per system and job; a change
      # to go.sum or mise.toml starts a new one from the last.
      - &go-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.sum', 'mise.toml') }}
          restore-keys: go-${{ runner.os }}-${{ github.job }}-
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      - run: make lint

  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - *go-cache
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      - run: make test

  # macOS runners are scarce, so the daily load workflow runs the criteria
  # on macOS.
  criteria:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - *go-cache
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      - run: make criteria

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The examples that use the catalog run with its main branch, and with
      # the tofu and jq that it pins.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: opstruss/catalog
          path: catalog
          persist-credentials: false
      - *go-cache
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      - run: mise trust catalog/mise.toml && mise -C catalog install opentofu jq
      # The reference pages are what docgen writes, new ones included.
      - run: make docs-gen && git add --intent-to-add docs && git diff --exit-code docs
      - run: |
          PATH="$(mise -C catalog where opentofu):$(mise -C catalog where jq):$PATH" \
            OPSTRUSS_DOCS_CATALOG="$PWD/catalog" go test -run 'TestDocsExamples' .
      - run: make docs

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - *go-cache
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      - run: make snapshot
