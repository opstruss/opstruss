version: 2

project_name: opstruss

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"

# The names and the contents of the release assets stay as they are:
# install scripts, mise, and CI download them by name.
archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: false
    files:
      - CHANGELOG.md
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

# Release notes come from CHANGELOG.md; see .github/workflows/release.yml.
changelog:
  disable: true

release:
  github:
    owner: opstruss
    name: opstruss
  draft: true
  replace_existing_draft: true
