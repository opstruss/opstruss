version: 2

project_name: opstruss

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"

# The names and the contents of the release assets stay as they are:
# install scripts, mise, and CI download them by name.
archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: false
    files:
      - CHANGELOG.md
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

# The notes of a release come from --release-notes, which
# .github/workflows/release.yml builds from CHANGELOG.md. Only the
# changelog pipe reads that file, so changelog.disable would publish a
# release without notes.

release:
  github:
    owner: opstruss
    name: opstruss
  draft: true
  replace_existing_draft: true
  # A tag with a pre-release part, as v1.0.0-rc.1, makes a pre-release,
  # which GitHub never marks as the latest release.
  prerelease: auto
